model_name: "random_forest_classifier"
random_seed: 42
eval_metric: "accuracy"
hyperparameters:
  learning_rate: 0.01
  batch_size: 32
  max_depth: 5

kmeans:
  k_range: [2, 10]                    # min and max k for elbow plot
  selected_k: 4                       # k to use for final clustering
  clustering_features:                 # features used as KMeans inputs
    - revenue
    - order_count
    - avg_order_value
  profiling_features:                  # extra features to profile (not used for clustering)
    - days_since_last_order
    - satisfaction_score
    - return_rate
  standardize: true                    # whether to StandardScaler before fitting
